<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 에이전트</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        #map { height: 360px; margin-top: 16px; border-radius: 16px; border: 2px solid #f6c667; }
        #mapnote { font-size: 13px; color: #555; margin-top: 4px; }
        html { background: #e8f5d0; }  /* 페이지 전체: 연한 연두색 */
        body { max-width: 640px; margin: 0 auto; padding: 16px; font-family: sans-serif; background: #e8f5d0; font-weight: 700; color: #e8710a; }
        h2 { color: #e8710a; }
        /* 박스: 크림색 + 둥근 모서리 + 두꺼운 주황 글씨 */
        textarea, #answer, details {
            background: #fff4d6; color: #e8710a; font-weight: 700;
            border: 2px solid #f6c667; border-radius: 16px;
        }
        textarea { width: 100%; height: 70px; box-sizing: border-box; padding: 10px; font-size: 16px; font-family: inherit; }
        textarea::placeholder { color: #f0a050; }
        button { padding: 8px 18px; font-size: 16px; margin-top: 8px; background: #ff9f1a; color: #fff; font-weight: 700; border: none; border-radius: 999px; cursor: pointer; }
        #answer { white-space: pre-wrap; margin-top: 16px; padding: 12px; }
        details { margin-top: 12px; padding: 8px 12px; }
        #mapnote { color: #e8710a; }
        .find { color: #2563eb; } .judge { color: #7c3aed; }
    </style>
</head>
<body>
    <h2>🍊 제주 여행 에이전트</h2>
    <textarea id="q" placeholder="예) 내일 동쪽에서 반나절 놀 곳 추천해줘"></textarea>
    <button id="ask">🍊 물어보기</button>
    <div id="answer"></div>
    <details id="steps" hidden><summary>생각 과정 보기</summary><ul id="list"></ul></details>

    <div id="map"></div>
    <div id="mapnote">질문하면 에이전트가 찾은 장소가 지도에 표시돼요 (위치는 지역 중심 근처의 대략적인 표시)</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // jeju_spots.json 에는 좌표가 없어서 세부 지역 중심 근처에 흩뿌려 표시합니다
        const CENTER = {
            "동쪽(성산)": [33.4585, 126.9400],
            "동쪽(구좌)": [33.5240, 126.8400],
            "서쪽(한림)": [33.4150, 126.2650],
            "서쪽(안덕)": [33.2600, 126.3600],
            "제주시":     [33.5000, 126.5300],
            "서귀포":     [33.2530, 126.5600],
        }
        const hash = (text, salt) => {
            let h = salt
            for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) % 1000
            return h / 1000
        }
        const map = L.map("map").setView([33.38, 126.55], 10)
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap contributors",
        }).addTo(map)
        const layer = L.layerGroup().addTo(map)

        const showSpots = (spots) => {
            layer.clearLayers()
            const points = []
            for (const spot of spots) {
                const center = CENTER[spot.area]
                if (!center) continue
                const pos = [center[0] + (hash(spot.name, 7) - 0.5) * 0.06, center[1] + (hash(spot.name, 13) - 0.5) * 0.06]
                points.push(pos)
                L.marker(pos).addTo(layer).bindPopup(
                    `<b>${spot.name}</b><br>${spot.area} · ${spot.indoor ? "실내" : "야외"}<br>${spot.description}`
                )
            }
            if (points.length) map.fitBounds(points, { padding: [40, 40] })
        }

        const ask = async () => {
            const answer = document.getElementById("answer")
            const steps = document.getElementById("steps")
            const list = document.getElementById("list")
            answer.textContent = "생각 중..."
            steps.hidden = true
            list.innerHTML = ""

            const res = await fetch("/api/agent", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: document.getElementById("q").value }),
            })
            const data = await res.json()
            if (data.error) { answer.textContent = "오류: " + data.error; return }

            answer.textContent = (data.mode === "practice" ? "[" + (data.note || "연습 모드 — Gemini 키 없음") + "]\n" : "") + data.answer
            for (const s of data.steps) {
                const li = document.createElement("li")
                li.className = s.kind
                li.textContent = s.text
                list.appendChild(li)
            }
            steps.hidden = false
            showSpots(data.spots || [])
        }
        document.getElementById("ask").addEventListener("click", ask)
    </script>
</body>
</html>
